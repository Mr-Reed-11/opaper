[package]
name = "opaper"
version = "0.1.0"
description = "Interface do opaper"
edition = "2024"

[lib]
name = "opaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Production builds must embed the frontend instead of loading devUrl.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
zbus = "5"
