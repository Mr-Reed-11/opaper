[package]
name = "opaper-engine"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "opaper-engine"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
calloop = { version = "0.14", features = ["signals"] }
jsonschema = "0.63"
pollster = "0.4"
regex = "1"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.21", features = ["calloop-wayland-source", "system"] }
wgpu = { version = "30", features = ["glsl"] }
zbus = "5"
